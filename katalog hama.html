<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Organisme Pengganggu Tanaman - TaniLindung</title>
  <link rel="stylesheet" href="katalog.css">
</head>
<body>
  <header class="navbar-header">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">TaniLindung</a>
      <nav class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="periksa tanaman.html">Periksa Tanaman</a>
        <a href="katalog hama.html" class="active">Katalog Hama</a>
        <a href="tips petani.html">Tips Petani</a>
      </nav>
    </div>
  </header>

  <main class="catalog-container">
    <div class="catalog-header">
      <span class="badge-pill">BASIS DATA & ENSIKLOPEDIA</span>
      <h1 class="catalog-title">Katalog Organisme Pengganggu Tanaman</h1>
      <p class="catalog-subtitle">Cari dan telusuri profil hama, penyakit, dan gulma yang menyerang tanaman pangan utama Indonesia.</p>
    </div>

    <div class="filter-wrapper">
      <div class="search-input-group">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Cari nama hama (contoh: Wereng, Ulat Grayak)...">
      </div>

      <div class="dropdown-filter">
        <select id="commoditySelect">
          <option value="all">Komoditas: Semua Tanaman</option>
          <option value="padi">Padi</option>
          <option value="jagung">Jagung</option>
          <option value="cabai">Cabai</option>
          <option value="tomat">Tomat</option>
          <option value="sawit">Kelapa Sawit</option>
        </select>
      </div>
    </div>

    <div class="category-tags">
      <button class="tag-btn active" data-cat="all">Semua Tanaman</button>
      <button class="tag-btn" data-cat="padi">Padi</button>
      <button class="tag-btn" data-cat="jagung">Jagung</button>
      <button class="tag-btn" data-cat="cabai">Cabai</button>
      <button class="tag-btn" data-cat="tomat">Tomat</button>
      <button class="tag-btn" data-cat="sayuran">Sayuran Mandiri</button>
    </div>

    <section class="pest-grid" id="pestGridContainer">
    </section>
  </main>

  <script src="katalog.js"></script>
</body>
</html>
